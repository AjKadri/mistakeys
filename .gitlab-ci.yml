include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: node:22-bookworm-slim

stages:
  - test
  - leak scan
  - build
  - deploy

variables:
  GIT_DEPTH: "0"
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

secret_detection:
  allow_failure: true
  rules:
    - when: on_success

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test

.gitleaks:
  stage: leak scan
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl tar
    - export GITLEAKS_VERSION=v8.30.1
    - export GITLEAKS_ARCHIVE=gitleaks_8.30.1_linux_x64.tar.gz
    - export GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    - curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
    - printf '%s  %s\n' "$GITLEAKS_SHA256" /tmp/gitleaks.tar.gz | sha256sum -c -
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - gitleaks version

mistakeys_leak_scan:
  extends: .gitleaks
  script:
    - set +e
    - ./scripts/run-gitleaks.sh leak-report.json .
    - scan_status=$?
    - set -e
    - test -f leak-report.json
    - exit "$scan_status"
  artifacts:
    when: always
    paths:
      - leak-report.json
    expire_in: 1 week

mistakeys_leak_scan_fixture:
  extends: .gitleaks
  script:
    - ./scripts/test-gitleaks-fixture.sh

build_images:
  stage: build
  image: docker:29.6.1-cli
  services:
    - name: docker:29.6.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/rotator:$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/consumer:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/rotator:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/consumer:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

deploy_production:
  stage: deploy
  image: alpine:3.22
  needs:
    - build_images
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - printf '%s' "$VPS_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - printf '%s' "$VPS_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -p "${VPS_SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_DEPLOY_USER@$VPS_HOST" "deploy $CI_COMMIT_SHA"
